<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - REDSTORE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="logo">
            <a href="index.html"><img src="images/redstore-logo-1.PNG" width="125px"></a>
        </div>
        <nav>
            <ul id="MenuItems">
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="my-orders.html">Orders</a></li>
                <li><a href="login.html" id="auth-link">Account</a></li>
            </ul>
        </nav>
        <div class="cart-icon" style="position: relative; display: inline-block; cursor: pointer;">
          <a href="cart.html"><img src="images/cart-1.PNG" width="30px" height="30px" style="vertical-align: middle;"></a>
          <span id="cart-count" style="position: absolute; top: -5px; right: -10px; background: #ff523b; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; font-weight: bold;">0</span>
        </div>
        <img src="images/menu-2.PNG" class="menu-icon" onclick="menutoggle()">
    </div>
</div>

<!-- Cart Items Details -->
<div class="small-container cart-page">
    <table id="cart-table" style="width:100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th style="text-align: left; padding: 10px; background: #ff523b; color: #fff;">Product</th>
                <th style="padding: 10px; background: #ff523b; color: #fff;">Quantity</th>
                <th style="padding: 10px; background: #ff523b; color: #fff;">Subtotal</th>
            </tr>
        </thead>
        <tbody id="cart-items-container">
            <!-- Cart items will be loaded here -->
        </tbody>
    </table>

    <div class="total-price" style="display: flex; justify-content: flex-end; margin-top: 20px;">
        <table style="border-top: 3px solid #ff523b; width: 100%; max-width: 400px;">
            <tr>
                <td style="padding: 10px;">Subtotal</td>
                <td style="padding: 10px; text-align: right;" id="cart-subtotal">₹0.00</td>
            </tr>
            <tr>
                <td style="padding: 10px;">Tax (0%)</td>
                <td style="padding: 10px; text-align: right;" id="cart-tax">₹0.00</td>
            </tr>
            <tr>
                <td style="padding: 10px; font-weight: bold;">Total</td>
                <td style="padding: 10px; text-align: right; font-weight: bold;" id="cart-total">₹0.00</td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: right; padding-top: 20px;">
                    <a href="#" class="btn" style="display: block; text-align: center; background: #ff523b; color: #fff; padding: 10px; border-radius: 30px; margin-top:10px;" onclick="proceedToCheckout(); return false;">Proceed to Checkout</a>
                </td>
            </tr>
        </table>
    </div>
</div>

<div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;"></div>

<script>
    var MenuItems = document.getElementById("MenuItems");
    MenuItems.style.maxHeight = "0px";
    function menutoggle() {
        if(MenuItems.style.maxHeight == "0px") {
            MenuItems.style.maxHeight = "200px";
        } else {
            MenuItems.style.maxHeight = "0px";
        }
    }
</script>
<script src="main.js"></script>
<script src="cart.js"></script>
<script src="auth.js"></script>
</body>
</html>
